name: build-mac

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            triplet: arm64-osx-static
          - runner: macos-13
            arch: x64
            triplet: x64-osx-static

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Alati (cmake, ninja, pkg-config)
        run: brew install cmake ninja pkg-config

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg (installed)
        uses: actions/cache@v4
        with:
          path: ~/vcpkg/installed
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: libarchive (static)
        run: |
          "$HOME/vcpkg/vcpkg" install \
            --overlay-triplets="$PWD/ci/triplets" \
            --triplet=${{ matrix.triplet }}

      - name: npm install
        run: npm install

      - name: Build native addon (Electron ABI)
        run: |
          ELECTRON_VER=$(node -p "require('electron/package.json').version")
          echo "Electron: $ELECTRON_VER  arch: ${{ matrix.arch }}"
          npx cmake-js compile \
            --runtime electron --runtime-version "$ELECTRON_VER" --arch ${{ matrix.arch }} \
            --CDCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            --CDVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            --CDVCPKG_OVERLAY_TRIPLETS="$PWD/ci/triplets"

      - name: Provjeri addon
        run: |
          file native/build/Release/archive_addon.node
          otool -L native/build/Release/archive_addon.node || true

      - name: Priprema notarizacionog ključa
        if: env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build & pakovanje (DMG)
        env:
          DEBUG: electron-builder
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AcMigo-Arhiver-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
